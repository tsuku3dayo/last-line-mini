name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run verify

  production-build:
    # 本番用の build が通り、本番の決まり（名前・base・SW がプレビューを扱わない）を満たすか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { APP_CHANNEL: production }
      - run: node scripts/check-dist.mjs --channel production

  e2e:
    runs-on: ubuntu-latest
    # @playwright/test と同じ版のコンテナ（package.json の版とそろえる）
    container: { image: mcr.microsoft.com/playwright:v1.64.1-noble }
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # コンテナの中のチェックアウトには git の履歴がないので、版に付けるコミットの番号を渡す（LLM-TC-9001-13）
      - run: echo "APP_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
        shell: bash
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
